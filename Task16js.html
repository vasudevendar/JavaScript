<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Magnification</title>
  <style>
    .container {
      position: relative;
      width: 300px;
      height: 300px;
      overflow: hidden;
    }

    /* Image style */
    img {
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease; /* Smooth zoom effect */
    }

    /* Magnification effect when hovered */
    .container:hover img {
      transform: scale(1.5); /* 1.5 times magnification */
    }
  </style>
</head>
<body>

<div class="container">
  <img src="JAVA.jpg" alt="Image for Magnification">
</div>

</body>
</html>
