<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculate Selling Price</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 300px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #dbdbdb;
    }

    h2 {
      color: #333;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <form onsubmit="return calculateSellingPrice();">
    <h2>Calculate Selling Price</h2>
    <label for="costPrice">Enter Cost Price:</label>
    <input type="number" id="costPrice" required>
    <button type="submit">Calculate</button>
    <div class="result" id="result"></div>
  </form>

  <script>
    function calculateSellingPrice() {
      const costPrice = parseFloat(document.getElementById('costPrice').value);

      if (isNaN(costPrice)) {
        alert('Please enter a valid cost price.');
        return false;
      }

      const discount = costPrice * 0.20;  // Calculate 20% discount
      const sellingPrice = costPrice - discount;

      // Display the selling price
      document.getElementById('result').innerHTML = 'Selling Price after 20% discount: ₹' + sellingPrice.toFixed(2);
      
      // Prevent form submission
      return false;
    }
  </script>

</body>
</html>
