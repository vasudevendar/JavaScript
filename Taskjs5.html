<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    label {
      display: block;
      margin: 5px 0;
    }
    input {
      padding: 5px;
      margin-bottom: 10px;
      width: 200px;
    }
    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Loan EMI Calculator</h2>
  <form onsubmit="return calculateEMI();">
    <label for="loanAmount">Loan Amount:</label>
    <input type="number" id="loanAmount" required><br>
    
    <label for="interestRate">Interest Rate (% per annum):</label>
    <input type="number" id="interestRate" required><br>
    
    <label for="loanTerm">Loan Term (in years):</label>
    <input type="number" id="loanTerm" required><br>
    
    <label for="emisPaid">Number of EMIs Paid:</label>
    <input type="number" id="emisPaid" required><br>

    <button type="submit">Calculate EMI</button>
  </form>

  <div id="result"></div>

  <script>
    function Loan(loanAmount, interestRate, loanTerm) {
      this.loanAmount = loanAmount;
      this.interestRate = interestRate;
      this.loanTerm = loanTerm;
    }

    // Method to calculate monthly EMI
    Loan.prototype.calculateMonthlyPayment = function() {
      const monthlyRate = (this.interestRate / 100) / 12;
      const totalMonths = this.loanTerm * 12;
      const emi = (this.loanAmount * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) /
                  (Math.pow(1 + monthlyRate, totalMonths) - 1);
      return emi;
    };

    // Method to check loan status
    Loan.prototype.checkLoanStatus = function(emisPaid) {
      const emi = this.calculateMonthlyPayment();
      const totalEMIs = this.loanTerm * 12;
      const totalPaid = emi * emisPaid;
      const remainingAmount = this.loanAmount + (emi * totalEMIs - this.loanAmount) - totalPaid;

      return {
        emisPaid: emisPaid,
        remainingEMIs: totalEMIs - emisPaid,
        remainingAmount: remainingAmount
      };
    };

    function calculateEMI() {
      const loanAmount = parseFloat(document.getElementById('loanAmount').value);
      const interestRate = parseFloat(document.getElementById('interestRate').value);
      const loanTerm = parseFloat(document.getElementById('loanTerm').value);
      const emisPaid = parseInt(document.getElementById('emisPaid').value);

      const loan = new Loan(loanAmount, interestRate, loanTerm);
      const emi = loan.calculateMonthlyPayment();
      const loanStatus = loan.checkLoanStatus(emisPaid);

      document.getElementById('result').innerHTML = `
        <p>Monthly EMI: ${emi.toFixed(2)}</p>
        <p>EMIs Paid: ${loanStatus.emisPaid}</p>
        <p>Remaining EMIs: ${loanStatus.remainingEMIs}</p>
        <p>Remaining Amount to be Paid: ${loanStatus.remainingAmount.toFixed(2)}</p>`;

      return false; // Prevent form submission
    }
  </script>
</body>
</html>
