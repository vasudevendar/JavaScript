<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: white;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3897f0;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #3180d1;
    }
    .error {
      color: red;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Instagram Login</h2>
  <form id="loginForm" onsubmit="return validateForm()">
    <input type="text" id="userInput" placeholder="Username, Email, or Phone" required>
    <div id="userError" class="error">Invalid username, email, or phone number</div>

    <input type="password" id="password" placeholder="Password" required>
    <div id="passwordError" class="error">Password must be at least 8 characters, including an uppercase letter, lowercase letter, digit, and special symbol.</div>

    <button type="submit">Log In</button>
  </form>
</div>

<script>
  function validateForm() {
    const userInput = document.getElementById("userInput").value;
    const userError = document.getElementById("userError");
    const password = document.getElementById("password").value;
    const passwordError = document.getElementById("passwordError");

    // Email Validation
    const emailPattern = /^[a-zA-Z0-9._-]+@gmail\.com$/;
    
    // Username Validation (no spaces or digits)
    const usernamePattern = /^[a-zA-Z]+$/;

    // Phone Number Validation (exactly 10 digits)
    const phonePattern = /^\d{10}$/;

    // Password Validation (8 chars, one upper, one lower, one digit, one special)
    const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    let validUser = false;

    // Validate if the input is a valid email, username, or phone number
    if (emailPattern.test(userInput)) {
      validUser = true;
    } else if (usernamePattern.test(userInput)) {
      validUser = true;
    } else if (phonePattern.test(userInput)) {
      validUser = true;
    } else {
      userError.style.display = "block";
      return false;
    }
    
    // Validate password
    if (!passwordPattern.test(password)) {
      passwordError.style.display = "block";
      return false;
    }

    // Hide errors if everything is valid
    userError.style.display = "none";
    passwordError.style.display = "none";
    
    alert("Login successful!");
    return true;
  }
</script>

</body>
</html>
