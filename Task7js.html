<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Eligibility</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      padding: 5px;
      margin: 5px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Check Scholarship Eligibility</h2>
  
  <label for="gpa">Enter Student GPA:</label>
  <input type="number" id="gpa" step="0.1" required><br><br>

  <button onclick="checkScholarship()">Check Eligibility</button>

  <div id="result"></div>

  <script>
    function checkScholarship() {
      const gpa = parseFloat(document.getElementById('gpa').value);

      if (isNaN(gpa) || gpa < 0 || gpa > 10) {
        alert('Please enter a valid GPA between 0 and 10.');
        return;
      }

      if (gpa >= 7.5) {
        document.getElementById('result').textContent = 'The student is eligible for a scholarship.';
      } else {
        document.getElementById('result').textContent = 'The student is not eligible for a scholarship.';
      }
    }
  </script>

</body>
</html>
